name: ACV Demo

on:
  workflow_dispatch:

jobs:
  acv-demo:
    name: Run ACV one-shot demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Start mock API
        run: |
          nohup python examples/mock_apis/users_api.py > mock_api.log 2>&1 &
          sleep 3

      - name: Run ACV validate
        run: |
          acv validate examples/openapi/sample_users_api.yaml --api-url http://localhost:8000 --format all --output ./output

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: acv-reports
          path: output/drift_report_*.{md,json}
